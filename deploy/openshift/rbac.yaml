apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-grid-provider-backend-managedclusters
rules:
  # The only writes: the Clusters API creates, labels and deletes
  # ManagedClusters. Models and Subscriptions write to Git, never to a
  # cluster; rbac_test.go fails on a write verb anywhere else.
  - apiGroups: ["cluster.open-cluster-management.io"]
    resources: ["managedclusters"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # OCM admission requires managedclustersets/join to place a ManagedCluster in a
  # ManagedClusterSet (unlabeled CRs join "default"). Without this, Create fails with:
  #   cannot add/remove the resource to/from ManagedClusterSet "default"
  - apiGroups: ["cluster.open-cluster-management.io"]
    resources: ["managedclustersets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cluster.open-cluster-management.io"]
    resources: ["managedclustersets/join"]
    verbs: ["create"]
  # Setting/updating spec.hubAcceptsClient requires the accept subresource.
  - apiGroups: ["register.open-cluster-management.io"]
    resources: ["managedclusters/accept"]
    verbs: ["update"]
  # Clusters List/Get read each cluster's provisioning from the root
  # ai-grid-ready Policy's status (AI_GRID_READY_POLICY, default
  # ai-grid-policies/ai-grid-ready). get on that one name only: other
  # Policies, and the per-cluster copies (named ai-grid-policies.ai-grid-ready)
  # where ACM renders hub templates such as fromSecret, stay unreadable. A
  # Role in ai-grid-policies would be narrower, but this kustomization's
  # namespace: ai-grid would move it. Change the name here if you change
  # AI_GRID_READY_POLICY. Models and Subscriptions read their status from
  # the catalog's Argo CD Applications instead: the Role at the end of this
  # file.
  - apiGroups: ["policy.open-cluster-management.io"]
    resources: ["policies"]
    resourceNames:
      - ai-grid-ready
    verbs: ["get"]
  # Clusters List/Get read each cluster's GPUs from ACM Search (--search-api-url).
  # Search shows a caller the resources of every managed cluster when it may
  # get this virtual resource (stolostron/search-v2-api pkg/rbac/userData.go,
  # userHasAllAccess). That is broad: this credential may query everything
  # Search indexes on every managed cluster, not only nodes; the backend only
  # asks for the GPU nodes, but nothing narrows the permission to them. The
  # narrower alternative Search supports is per cluster: list rights in each
  # managed cluster's namespace (Search maps them to that cluster's resources,
  # same file, getSSRRforNamespace) or ACM's fine-grained clusterview
  # permissions, which would have to be granted for every cluster added
  # later. Revisit when the backend calls the hub as the user.
  - apiGroups: ["search.open-cluster-management.io"]
    resources: ["searches/allManagedData"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-grid-provider-backend-managedclusters
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-grid-provider-backend-managedclusters
subjects:
  - kind: ServiceAccount
    name: ai-grid-provider-backend
    namespace: ai-grid
---
# Models and Subscriptions read their status from the health of the catalog's
# Argo CD Applications in openshift-gitops (AI_GRID_CATALOG_APP_NAMESPACE).
# Without this Role, models show as saved to Git and subscriptions with no
# phase. list can't be limited by name, so the backend can read every
# Application in openshift-gitops, including any inline Helm values or plugin
# settings their specs carry; keep secrets out of Application specs there.
# Change the namespace here if you change AI_GRID_CATALOG_APP_NAMESPACE (the
# kustomization's NamespaceTransformer leaves it alone).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-grid-provider-backend-catalog-status
  namespace: openshift-gitops
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-grid-provider-backend-catalog-status
  namespace: openshift-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-grid-provider-backend-catalog-status
subjects:
  - kind: ServiceAccount
    name: ai-grid-provider-backend
    namespace: ai-grid
