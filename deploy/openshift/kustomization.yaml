apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

transformers:
  - namespace-transformer.yaml

labels:
  - pairs:
      app.kubernetes.io/name: ai-grid-provider-backend
      app.kubernetes.io/part-of: ai-grid
    includeSelectors: true

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  # No Route: the API has no authentication of its own, and anyone who could
  # reach it could commit a model (any image, onto the spokes) or a
  # subscription to the catalog. Use oc port-forward, or put an
  # authenticating proxy in front of the Service.

images:
  - name: ai-grid-provider-backend
    newName: ghcr.io/ai-grid-cloud/ai-grid-provider-backend
    newTag: latest
