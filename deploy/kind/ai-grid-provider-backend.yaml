apiVersion: v1
kind: Namespace
metadata:
  name: ai-grid
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-grid-provider-backend
  namespace: ai-grid
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-grid-provider-backend-managedclusters
rules:
  # The only writes: the Clusters API creates, labels and deletes
  # ManagedClusters. Models and Subscriptions write to Git, never to a
  # cluster; rbac_test.go fails on a write verb anywhere else.
  - apiGroups: ["cluster.open-cluster-management.io"]
    resources: ["managedclusters"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # OCM admission: unlabeled ManagedClusters join ManagedClusterSet "default".
  - apiGroups: ["cluster.open-cluster-management.io"]
    resources: ["managedclustersets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["cluster.open-cluster-management.io"]
    resources: ["managedclustersets/join"]
    verbs: ["create"]
  # Setting/updating spec.hubAcceptsClient requires the accept subresource.
  - apiGroups: ["register.open-cluster-management.io"]
    resources: ["managedclusters/accept"]
    verbs: ["update"]
  # Clusters read the ai-grid-ready Policy. Kind has no ACM, so this read
  # finds nothing. Models and Subscriptions would read status from the
  # catalog's Argo CD Applications (deploy/openshift/rbac.yaml); kind has no
  # Argo CD, so nothing grants it and the APIs report no status.
  - apiGroups: ["policy.open-cluster-management.io"]
    resources: ["policies"]
    resourceNames:
      - ai-grid-ready
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-grid-provider-backend-managedclusters
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ai-grid-provider-backend-managedclusters
subjects:
  - kind: ServiceAccount
    name: ai-grid-provider-backend
    namespace: ai-grid
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-grid-provider-backend
  namespace: ai-grid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-grid-provider-backend
  template:
    metadata:
      labels:
        app: ai-grid-provider-backend
    spec:
      serviceAccountName: ai-grid-provider-backend
      # Models and Subscriptions commit to a Git repository. On Kind it is a
      # bare repository on an emptyDir, created with one seed commit (a README
      # in catalog/subscriptions/) and lost with the pod. The backend serves
      # file:// in-process, so its image needs no git.
      initContainers:
        - name: catalog-repo
          image: docker.io/alpine/git:v2.52.0@sha256:4a0e72d49596a1f5d3701aeedafdadc5c0da4062be4657c7bdc4017387f591cc
          command:
            - sh
            - -ec
            - |
              repo=/catalog/repo.git
              if [ ! -d "$repo" ]; then
                git init --bare -b main "$repo"
                seed="$(mktemp -d)"
                git -C "$seed" init -b main
                mkdir -p "$seed/catalog/subscriptions"
                echo "Subscriptions the backend commits. Keep this file: Git drops an empty directory." > "$seed/catalog/subscriptions/README"
                git -C "$seed" add .
                git -C "$seed" -c user.name=ai-grid-provider-backend -c user.email=ai-grid-provider-backend@noreply.invalid commit -q -m "catalog: seed"
                git -C "$seed" push -q "$repo" main
              fi
              # The backend runs as UID 1001.
              chmod -R a+rwX /catalog
          volumeMounts:
            - name: catalog
              mountPath: /catalog
      volumes:
        - name: catalog
          emptyDir: {}
      containers:
        - name: ai-grid-provider-backend
          image: localhost/ai-grid-provider-backend:dev
          imagePullPolicy: IfNotPresent
          # Kind runs no ACM Search, so clusters carry no GPUs (status.gpus).
          args:
            - --search-api-url=off
          env:
            - name: KEYCLOAK_URL
              value: http://keycloak.ai-grid.svc:8080
            - name: KEYCLOAK_ADMIN_REALM
              value: master
            - name: KEYCLOAK_REALM
              value: ai-grid
            - name: KEYCLOAK_ADMIN_USERNAME
              value: admin
            - name: KEYCLOAK_ADMIN_PASSWORD
              value: admin
            - name: AI_GRID_GIT_URL
              value: file:///catalog/repo.git
          volumeMounts:
            - name: catalog
              mountPath: /catalog
          ports:
            - name: grpc
              containerPort: 8080
            - name: http
              containerPort: 8081
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-grid-provider-backend
  namespace: ai-grid
spec:
  selector:
    app: ai-grid-provider-backend
  ports:
    - name: grpc
      port: 8080
      targetPort: grpc
    - name: http
      port: 8081
      targetPort: http
